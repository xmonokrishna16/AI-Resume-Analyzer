<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>AI Resume Analyzer</h1>
            <p>Upload your resume to discover your skill gaps.</p>
        </header>

        <!-- Upload Section -->
        <div id="upload-section" class="card">
            <form id="analyze-form">
                <div class="form-group">
                    <label>Target Job Description</label>
                    <textarea name="job_desc" rows="5" required
                        placeholder="Paste the job requirements here..."></textarea>
                </div>
                <div class="form-group">
                    <label>Upload Resume (.pdf, .docx)</label>
                    <input type="file" name="resume" accept=".pdf,.docx" required>
                </div>
                <button type="submit" id="submit-btn">Analyze Match</button>
            </form>
            <div id="loading" style="display: none;">🧠 AI is analyzing your profile...</div>
        </div>

        <!-- Dashboard Section (Hidden by default) -->
        <div id="dashboard-section" class="card" style="display: none;">
            <h2>Analysis Results</h2>

            <div class="dashboard-grid">
                <!-- Score Chart -->
                <div class="chart-container">
                    <canvas id="scoreChart"></canvas>
                    <h3 id="score-text">0%</h3>
                </div>

                <!-- Missing Skills -->
                <div class="skills-container">
                    <h3>Critical Missing Skills</h3>
                    <ul id="missing-skills-list" class="bad-list"></ul>
                </div>
            </div>

            <!-- Roadmap -->
            <div class="roadmap-container">
                <h3>Personalized Learning Roadmap</h3>
                <div id="roadmap-list" class="roadmap-timeline"></div>
            </div>

            <button onclick="location.reload()" class="btn-secondary">Analyze Another</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
