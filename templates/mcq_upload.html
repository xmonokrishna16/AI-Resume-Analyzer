<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Generator - Skill Bridge AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body.mcq-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 24px clamp(20px, 4vw, 64px);
            color: #15213c;
            background: #f2f3ff url("{{ url_for('static', filename='images/mcq generate backdrop.png') }}") center / cover fixed no-repeat;
        }

        .mcq-header {
            width: 100%;
            max-width: 1500px;
            margin: 0 auto 22px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            align-items: center;
        }

        .mcq-header .brand-logo {
            justify-self: start;
            gap: 10px;
            font-size: 1.25rem;
            color: #17213a;
        }

        .mcq-header .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 11px;
            background: linear-gradient(140deg, #218dff, #7048f5);
            box-shadow: 0 6px 14px rgba(77, 91, 233, .25);
        }

        .mcq-back {
            justify-self: center;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            border: 1px solid rgba(126, 87, 255, .4);
            border-radius: 999px;
            background: rgba(255, 255, 255, .62);
            color: #6543d8;
            font-size: .92rem;
            font-weight: 650;
            text-decoration: none;
            transition: background .2s ease, transform .2s ease;
        }

        .mcq-back:hover {
            background: #fff;
            transform: translateY(-1px);
        }

        .mcq-back:focus-visible,
        .mcq-page button:focus-visible,
        .mcq-page input:focus-visible {
            outline: 3px solid rgba(73, 132, 255, .42);
            outline-offset: 3px;
        }

        .mcq-main {
            width: 100%;
            max-width: 1024px;
            flex: 1;
            display: flex;
            align-items: center;
            margin: 0 auto;
        }

        .upload-container {
            position: relative;
            isolation: isolate;
            display: grid;
            grid-template-columns: minmax(220px, .75fr) minmax(0, 1.8fr);
            align-items: center;
            gap: clamp(24px, 4vw, 58px);
            width: 100%;
            min-height: 480px;
            padding: clamp(30px, 5vw, 52px);
            overflow: hidden;
            border: 1px solid rgba(135, 147, 255, .62);
            border-radius: 34px;
            background: rgba(255, 255, 255, .79);
            box-shadow: 0 24px 60px rgba(80, 83, 190, .17), inset 0 1px 0 rgba(255, 255, 255, .9);
            backdrop-filter: blur(18px);
        }

        .upload-container::before {
            position: absolute;
            z-index: -1;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, .7), transparent 60%);
            content: "";
            pointer-events: none;
        }

        .mcq-illustration {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mcq-illustration svg {
            display: block;
            width: min(100%, 255px);
            height: auto;
            overflow: visible;
            filter: drop-shadow(0 18px 22px rgba(78, 92, 228, .17));
        }

        .mcq-content {
            min-width: 0;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            padding: 7px 12px;
            border: 1px solid rgba(126, 87, 255, .12);
            border-radius: 999px;
            background: #f0eaff;
            color: #6841dc;
            font-size: .82rem;
            font-weight: 700;
        }

        .mcq-content h1 {
            margin: 0;
            color: #15213c;
            font-size: clamp(2rem, 3.2vw, 2.65rem);
            font-weight: 750;
            letter-spacing: -.045em;
            line-height: 1.12;
        }

        .mcq-content h1 span {
            color: #574cf2;
            background: linear-gradient(90deg, #258bff, #7950f5);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .mcq-description {
            margin: 10px 0 20px;
            color: #5d6e91;
            font-size: .98rem;
            line-height: 1.55;
        }

        .mcq-form-panel {
            padding: 17px;
            border: 1px solid rgba(126, 144, 226, .17);
            border-radius: 22px;
            background: rgba(255, 255, 255, .56);
        }

        .form-group {
            margin: 0;
        }

        .form-group + .form-group {
            margin-top: 16px;
        }

        .form-group > label,
        .question-count-title {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 0 0 10px;
            color: #1c2946;
            font-size: .92rem;
            font-weight: 700;
        }

        .field-icon {
            display: inline-flex;
            width: 22px;
            height: 22px;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #eee8ff;
            color: #7152ea;
            font-size: .78rem;
            font-weight: 800;
        }

        .file-dropzone {
            position: relative;
            display: flex;
            min-height: 76px;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border: 1.5px dashed #c9caff;
            border-radius: 17px;
            background: rgba(250, 250, 255, .75);
            transition: border-color .2s ease, background .2s ease;
        }

        .file-dropzone:hover,
        .file-dropzone:focus-within {
            border-color: #7888ff;
            background: #fff;
        }

        .file-dropzone input[type="file"] {
            width: auto;
            max-width: 100%;
            padding: 0;
            border: 0;
            border-radius: 0;
            background: transparent;
            color: #657393;
            font-size: .88rem;
        }

        .file-dropzone input[type="file"]::file-selector-button {
            margin-right: 10px;
            padding: 8px 13px;
            border: 0;
            border-radius: 10px;
            background: #e9eaff;
            color: #2459cc;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .question-count-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .question-option {
            display: inline-flex;
            min-width: 145px;
            align-items: center;
            gap: 9px;
            margin: 0;
            padding: 10px 14px;
            border: 1px solid #e0e3f5;
            border-radius: 999px;
            background: rgba(255, 255, 255, .7);
            color: #253352;
            font-size: .9rem;
            font-weight: 650;
            cursor: pointer;
            transition: border-color .2s ease, background .2s ease;
        }

        .question-option:has(input:checked) {
            border-color: #7ca4ff;
            background: #f1f6ff;
        }

        .question-option input[type="radio"] {
            width: 16px;
            height: 16px;
            flex: 0 0 auto;
            margin: 0;
            padding: 0;
            accent-color: #347dff;
        }

        .generate-button {
            display: flex;
            width: 100%;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
            padding: 14px 22px;
            border: 0;
            border-radius: 999px;
            background: linear-gradient(100deg, #278df5 0%, #4561f5 54%, #9a45ed 100%);
            box-shadow: 0 9px 20px rgba(84, 95, 235, .22);
            color: #fff;
            font-size: .98rem;
            font-weight: 700;
            transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
        }

        .generate-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(84, 95, 235, .3);
        }

        .generate-button:disabled {
            opacity: .7;
            cursor: wait;
        }

        .loading-spinner {
            display: none;
            margin-top: 16px;
            color: #4c5f9a;
            font-size: .9rem;
            font-weight: 600;
            text-align: center;
        }

        .loading-spinner::before {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 8px;
            border: 2px solid #c9d4ff;
            border-top-color: #4b67f2;
            border-radius: 50%;
            content: "";
            vertical-align: -2px;
            animation: mcq-spin .8s linear infinite;
        }

        @keyframes mcq-spin {
            to { transform: rotate(360deg); }
        }

        /* Exam Area Styles */
        #examArea {
            display: none;
        }

        #examArea h2 {
            color: #182440;
            font-size: 1.8rem;
        }

        .question-card {
            margin-bottom: 24px;
            padding: 20px;
            border: 1px solid #e3e7f5;
            border-radius: 16px;
            background: rgba(255, 255, 255, .75);
        }

        .question-text {
            font-weight: 600;
            margin-bottom: 14px;
            font-size: 1.1rem;
            color: #172440;
        }

        .option-label {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            width: 100%;
            margin-bottom: 10px;
            padding: 12px 14px;
            border: 1px solid #e2e6f3;
            border-radius: 12px;
            cursor: pointer;
            background: rgba(255, 255, 255, .8);
            transition: border-color .2s ease, background .2s ease;
            text-align: left;
        }

        .option-label:hover {
            background-color: #f5f7ff;
            border-color: #aab9ff;
        }

        .option-label input[type="radio"] {
            margin: 0 !important;
            width: 18px !important;
            height: 18px !important;
            flex-shrink: 0;
            accent-color: #2563eb;
        }

        .option-label span,
        .option-label {
            color: #1e293b;
            font-size: 0.95rem;
        }

        .exam-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-secondary {
            background: #eef0ff;
            color: #4e48bc;
            padding: 10px 16px;
            border-radius: 999px;
            text-decoration: none;
            cursor: pointer;
            border: none;
            font-weight: 650;
        }

        #resultsArea {
            padding: 16px 18px;
            border: 1px solid #dfe5ff;
            border-radius: 14px;
            background: rgba(243, 246, 255, .9);
            color: #273b72;
        }

        @media (max-width: 720px) {
            body.mcq-page {
                padding: 18px 14px;
                background-attachment: scroll;
            }

            .mcq-header {
                grid-template-columns: 1fr auto;
                margin-bottom: 14px;
            }

            .mcq-back {
                grid-column: 2;
                grid-row: 1;
                justify-self: end;
            }

            .upload-container {
                grid-template-columns: 1fr;
                min-height: 0;
                padding: clamp(22px, 6vw, 36px);
                border-radius: 25px;
            }

            .mcq-illustration {
                display: none;
            }

            .mcq-content h1 {
                font-size: clamp(1.9rem, 8vw, 2.4rem);
            }
        }

        @media (max-width: 420px) {
            .mcq-header .brand-logo {
                gap: 7px;
                font-size: 1.05rem;
            }

            .mcq-header .logo-icon {
                width: 35px;
                height: 35px;
            }

            .mcq-back {
                padding: 8px 12px;
            }

            .mcq-form-panel {
                padding: 13px;
            }

            .question-option {
                width: 100%;
            }
        }

        /* Print Styles for PDF Generation */
        @media print {
            body * {
                visibility: hidden;
            }

            #examArea,
            #examArea * {
                visibility: visible;
            }

            #examArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }

            .exam-actions,
            .mcq-header,
            .mcq-illustration {
                display: none !important;
            }

            body.mcq-page {
                padding: 0;
                background: #fff;
            }

            .mcq-main {
                display: block;
            }

            .upload-container {
                display: block;
                min-height: 0;
                padding: 0;
                border: 0;
                border-radius: 0;
                background: #fff;
                box-shadow: none;
            }

            .question-card {
                border: none;
                border-bottom: 1px solid #ccc;
                break-inside: avoid;
            }
        }
    </style>
</head>

<body class="mcq-page">
    <header class="mcq-header">
        <a href="{{ url_for('dashboard') }}" class="brand-logo">
            <div class="logo-icon">SB</div>
            <div>Skill Bridge <span class="highlight">AI</span></div>
        </a>
        <a href="{{ url_for('dashboard') }}" class="mcq-back"><span aria-hidden="true">←</span> Back</a>
    </header>

    <main class="mcq-main">
        <div class="upload-container">
            <div class="mcq-illustration" aria-hidden="true">
                <svg viewBox="0 0 280 300" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="cardGradient" x1="58" y1="47" x2="221" y2="244" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#fff"/>
                            <stop offset="1" stop-color="#E9EBFF"/>
                        </linearGradient>
                        <linearGradient id="badgeGradient" x1="177" y1="156" x2="237" y2="216" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#288BFF"/>
                            <stop offset="1" stop-color="#7849EF"/>
                        </linearGradient>
                    </defs>
                    <circle cx="137" cy="145" r="115" fill="#8095FF" fill-opacity=".09"/>
                    <circle cx="137" cy="145" r="92" fill="#8794FF" fill-opacity=".09"/>
                    <path d="M37 194c12 33 53 53 105 48 53-5 96-35 104-68" stroke="#8A83FF" stroke-width="4" stroke-linecap="round"/>
                    <rect x="51" y="46" width="160" height="205" rx="24" transform="rotate(-11 51 46)" fill="url(#cardGradient)" stroke="#fff" stroke-width="3"/>
                    <rect x="83" y="79" width="93" height="10" rx="5" transform="rotate(-11 83 79)" fill="#AEB8FF"/>
                    <rect x="91" y="110" width="25" height="25" rx="6" transform="rotate(-11 91 110)" fill="#477DF8"/>
                    <path d="m99 122 5 5 10-13" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    <rect x="130" y="106" width="53" height="8" rx="4" transform="rotate(-11 130 106)" fill="#B7C0F2"/>
                    <rect x="133" y="120" width="37" height="7" rx="3.5" transform="rotate(-11 133 120)" fill="#D1D6F4"/>
                    <rect x="98" y="151" width="22" height="22" rx="5" transform="rotate(-11 98 151)" stroke="#9DAAF4" stroke-width="3"/>
                    <rect x="137" y="146" width="47" height="8" rx="4" transform="rotate(-11 137 146)" fill="#B7C0F2"/>
                    <rect x="141" y="160" width="34" height="7" rx="3.5" transform="rotate(-11 141 160)" fill="#D1D6F4"/>
                    <rect x="105" y="189" width="22" height="22" rx="5" transform="rotate(-11 105 189)" stroke="#9DAAF4" stroke-width="3"/>
                    <rect x="145" y="184" width="42" height="8" rx="4" transform="rotate(-11 145 184)" fill="#B7C0F2"/>
                    <circle cx="202" cy="184" r="35" fill="url(#badgeGradient)"/>
                    <circle cx="202" cy="184" r="35" stroke="white" stroke-opacity=".55" stroke-width="2"/>
                    <path d="M196 174c0-5 4-9 10-9s10 4 10 9c0 8-10 9-10 17m0 9v1" stroke="white" stroke-width="5" stroke-linecap="round"/>
                    <path d="m46 112 4 9 9 4-9 4-4 9-4-9-9-4 9-4 4-9Zm185-54 3 7 7 3-7 3-3 7-3-7-7-3 7-3 3-7Zm-194 181 4 9 9 4-9 4-4 9-4-9-9-4 9-4 4-9Z" fill="#9A72FF"/>
                    <path d="m239 116 2 5 5 2-5 2-2 5-2-5-5-2 5-2 2-5Z" fill="#5F8CFF"/>
                </svg>
            </div>

            <!-- Upload Setup Form -->
            <div id="setupArea" class="mcq-content">
                <span class="eyebrow"><span aria-hidden="true">✦</span> Generate MCQs</span>
                <h1>Generate <span>MCQ</span> Test</h1>
                <p class="mcq-description">Upload your study material (PDF or DOCX) to generate a custom multiple-choice exam.</p>

                <form id="mcqForm">
                    <div class="mcq-form-panel">
                        <div class="form-group">
                            <label for="study_material"><span class="field-icon" aria-hidden="true">↑</span> Upload Material (PDF/DOCX)</label>
                            <div class="file-dropzone">
                                <input type="file" id="study_material" name="study_material" accept=".pdf,.docx" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <span class="question-count-title"><span class="field-icon" aria-hidden="true">?</span> Number of Questions</span>
                            <div class="question-count-options" role="radiogroup" aria-label="Number of questions">
                                <label class="question-option"><input type="radio" name="question_count" value="20" checked> 20 Questions</label>
                                <label class="question-option"><input type="radio" name="question_count" value="50"> 50 Questions</label>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="generate-button"><span aria-hidden="true">ϟ</span> Generate Test <span aria-hidden="true">→</span></button>
                </form>

                <div id="loadingIndicator" class="loading-spinner" role="status" aria-live="polite">
                    Analyzing document and generating questions... This may take a minute.
                </div>
            </div>

            <!-- Dynamic Exam Area -->
            <div id="examArea" class="mcq-content">
                <h2>Your Custom Assessment</h2>
                <div id="questionsContainer"></div>

                <div class="exam-actions">
                    <button id="btnSubmitTest" class="btn-launch" style="border:none; cursor:pointer;">Submit
                        Answers</button>
                    <button id="btnPrint" class="btn-secondary">Download as PDF / Print</button>
                </div>

                <div id="resultsArea" style="margin-top: 20px; font-weight: bold; font-size: 1.2rem; display: none;">
                </div>
            </div>

        </div>
    </main>

    <script>
        let currentQuestions = [];

        document.getElementById('mcqForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            const loading = document.getElementById('loadingIndicator');
            const submitBtn = form.querySelector('button[type="submit"]');

            loading.style.display = 'block';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/generate_mcq', { method: 'POST', body: formData });
                const data = await response.json();

                if (data.status === 'success') {
                    currentQuestions = data.questions;
                    renderTest(currentQuestions);
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred while generating the test.');
            } finally {
                loading.style.display = 'none';
                submitBtn.disabled = false;
            }
        });

        function renderTest(questions) {
            document.getElementById('setupArea').style.display = 'none';
            document.getElementById('examArea').style.display = 'block';

            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            questions.forEach((q, index) => {
                const qDiv = document.createElement('div');
                qDiv.className = 'question-card';
                qDiv.id = `question-${index}`;

                let optionsHtml = '';
                q.options.forEach((opt, oIndex) => {
                    optionsHtml += `
                        <label class="option-label">
                            <input type="radio" name="q${index}" value="${opt.replace(/"/g, '&quot;')}">
                            <span>${opt}</span>
                        </label>
                    `;
                });

                qDiv.innerHTML = `
                    <div class="question-text">${index + 1}. ${q.question}</div>
                    ${optionsHtml}
                    <div class="explanation" style="display: none; margin-top: 10px; color: #16a34a; font-size: 0.9rem;">
                        <strong>Explanation:</strong> ${q.explanation}
                    </div>
                `;
                container.appendChild(qDiv);
            });
        }

        // Print / Download PDF trigger
        document.getElementById('btnPrint').addEventListener('click', () => {
            window.print();
        });

        // Basic Grading Logic
        document.getElementById('btnSubmitTest').addEventListener('click', async () => {
            const submitBtn = document.getElementById('btnSubmitTest');
            if (submitBtn.disabled) return;
            submitBtn.disabled = true;

            let score = 0;

            currentQuestions.forEach((q, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                const qCard = document.getElementById(`question-${index}`);
                const expDiv = qCard.querySelector('.explanation');

                expDiv.style.display = 'block';

                if (selected && selected.value.trim() === q.correct_answer.trim()) {
                    score++;
                    qCard.style.borderLeft = "5px solid #16a34a";
                } else {
                    qCard.style.borderLeft = "5px solid #dc2626";
                }
            });

            const resultsArea = document.getElementById('resultsArea');
            resultsArea.style.display = 'block';
            const percent = Math.round((score / currentQuestions.length) * 100);
            resultsArea.innerHTML = `You scored ${score} out of ${currentQuestions.length} (${percent}%)!`;
            const uploadedFile = document.getElementById('study_material').files[0];
            const topicName = uploadedFile
                ? uploadedFile.name.replace(/\.[^.]+$/, '')
                : 'Study Material Assessment';

            try {
                const response = await fetch('/api/save_mcq_result', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        topic_name: topicName,
                        total_questions: currentQuestions.length,
                        score: score
                    })
                });
                const saveResult = await response.json();
                if (!response.ok || saveResult.status !== 'success') {
                    throw new Error(saveResult.message || 'The score could not be saved.');
                }
                resultsArea.textContent += ' Result saved to your analytics.';
            } catch (err) {
                console.error("Failed to save score:", err);
                resultsArea.textContent += ' Your score could not be saved. Please try again.';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
